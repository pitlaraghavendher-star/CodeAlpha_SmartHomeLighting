<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1500" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">Automated Smart Home Lighting System</text>
  <text x="500" y="72" text-anchor="middle" font-size="16" fill="#555">System Flowchart</text>

  <!-- Start -->
  <ellipse cx="500" cy="130" rx="90" ry="34" fill="#4361ee" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="136" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">START</text>

  <line x1="500" y1="164" x2="500" y2="200" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Init sensors -->
  <rect x="380" y="200" width="240" height="55" rx="8" fill="#eef2ff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="223" text-anchor="middle" font-size="14" fill="#1a1a2e">Initialize System</text>
  <text x="500" y="242" text-anchor="middle" font-size="13" fill="#1a1a2e">(PIR sensor, LDR sensor, RTC/Timer)</text>

  <line x1="500" y1="255" x2="500" y2="290" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Manual override branch -->
  <polygon points="500,290 620,345 500,400 380,345" fill="#fff3cd" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="340" text-anchor="middle" font-size="13" fill="#1a1a2e">Manual Override</text>
  <text x="500" y="358" text-anchor="middle" font-size="13" fill="#1a1a2e">switch ON?</text>

  <!-- Manual ON path (right) -->
  <line x1="620" y1="345" x2="760" y2="345" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="335" text-anchor="middle" font-size="13" fill="#2b2b2b">Yes</text>
  <rect x="700" y="318" width="180" height="55" rx="8" fill="#d4edda" stroke="#1a1a2e" stroke-width="2"/>
  <text x="790" y="341" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="bold">Force Lights ON</text>
  <text x="790" y="359" text-anchor="middle" font-size="12" fill="#1a1a2e">(user controlled)</text>

  <!-- No path (down) -->
  <line x1="500" y1="400" x2="500" y2="440" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="425" text-anchor="start" font-size="13" fill="#2b2b2b">No</text>

  <!-- LDR check -->
  <polygon points="500,440 630,500 500,560 370,500" fill="#fff3cd" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="495" text-anchor="middle" font-size="13" fill="#1a1a2e">Ambient light below</text>
  <text x="500" y="513" text-anchor="middle" font-size="13" fill="#1a1a2e">threshold (LDR)?</text>

  <!-- No branch to loop -->
  <line x1="630" y1="500" x2="850" y2="500" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="490" text-anchor="middle" font-size="13" fill="#2b2b2b">No (bright)</text>
  <rect x="770" y="473" width="160" height="55" rx="8" fill="#f8d7da" stroke="#1a1a2e" stroke-width="2"/>
  <text x="850" y="496" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="bold">Keep Lights OFF</text>
  <text x="850" y="514" text-anchor="middle" font-size="12" fill="#1a1a2e">Daylight sufficient</text>

  <line x1="500" y1="560" x2="500" y2="600" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="585" text-anchor="start" font-size="13" fill="#2b2b2b">Yes (dark)</text>

  <!-- Motion sensor check -->
  <polygon points="500,600 640,662 500,724 360,662" fill="#fff3cd" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="657" text-anchor="middle" font-size="13" fill="#1a1a2e">PIR sensor detects</text>
  <text x="500" y="675" text-anchor="middle" font-size="13" fill="#1a1a2e">motion?</text>

  <!-- No motion -> loop back to monitoring -->
  <line x1="360" y1="662" x2="150" y2="662" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="652" text-anchor="middle" font-size="13" fill="#2b2b2b">No</text>
  <rect x="30" y="635" width="180" height="55" rx="8" fill="#f8d7da" stroke="#1a1a2e" stroke-width="2"/>
  <text x="120" y="658" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="bold">Lights Remain OFF</text>
  <text x="120" y="676" text-anchor="middle" font-size="12" fill="#1a1a2e">Continue monitoring</text>
  <path d="M120,635 C120,560 300,560 500,440" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <line x1="500" y1="724" x2="500" y2="764" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="749" text-anchor="start" font-size="13" fill="#2b2b2b">Yes</text>

  <!-- Turn on lights -->
  <rect x="380" y="764" width="240" height="55" rx="8" fill="#d4edda" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="787" text-anchor="middle" font-size="14" fill="#1a1a2e" font-weight="bold">Turn ON Lights</text>
  <text x="500" y="806" text-anchor="middle" font-size="13" fill="#1a1a2e">(Relay/Triac activates lamp)</text>

  <line x1="500" y1="819" x2="500" y2="855" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Start timer -->
  <rect x="380" y="855" width="240" height="55" rx="8" fill="#eef2ff" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="878" text-anchor="middle" font-size="14" fill="#1a1a2e">Start / Reset Timer</text>
  <text x="500" y="897" text-anchor="middle" font-size="13" fill="#1a1a2e">(e.g., 5 minute hold)</text>

  <line x1="500" y1="910" x2="500" y2="946" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Motion during timer? -->
  <polygon points="500,946 650,1010 500,1074 350,1010" fill="#fff3cd" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="1000" text-anchor="middle" font-size="13" fill="#1a1a2e">New motion detected</text>
  <text x="500" y="1018" text-anchor="middle" font-size="13" fill="#1a1a2e">before timer expires?</text>

  <!-- Yes -> reset timer (loop back) -->
  <path d="M650,1010 C820,1010 820,882 620,882" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="960" text-anchor="middle" font-size="13" fill="#2b2b2b">Yes - Reset Timer</text>

  <!-- No -> continue to timer expired -->
  <line x1="500" y1="1074" x2="500" y2="1110" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="1097" text-anchor="start" font-size="13" fill="#2b2b2b">No</text>

  <!-- Timer expired -> turn off -->
  <rect x="380" y="1110" width="240" height="55" rx="8" fill="#f8d7da" stroke="#1a1a2e" stroke-width="2"/>
  <text x="500" y="1133" text-anchor="middle" font-size="14" fill="#1a1a2e" font-weight="bold">Turn OFF Lights</text>
  <text x="500" y="1152" text-anchor="middle" font-size="13" fill="#1a1a2e">Timer expired, no motion</text>

  <line x1="500" y1="1165" x2="500" y2="1200" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop back to monitoring -->
  <path d="M500,1200 C500,1250 140,1250 140,662" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="270" y="1265" text-anchor="middle" font-size="13" fill="#2b2b2b">Return to continuous monitoring loop</text>

  <!-- Manual ON also loops back -->
  <path d="M790,373 C790,1230 550,1230 500,1200" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="700" y="1350" width="18" height="18" fill="#fff3cd" stroke="#1a1a2e"/>
  <text x="725" y="1364" font-size="13" fill="#1a1a2e">Decision (sensor check)</text>
  <rect x="700" y="1378" width="18" height="18" fill="#eef2ff" stroke="#1a1a2e"/>
  <text x="725" y="1392" font-size="13" fill="#1a1a2e">Process / Action</text>
  <rect x="700" y="1406" width="18" height="18" fill="#d4edda" stroke="#1a1a2e"/>
  <text x="725" y="1420" font-size="13" fill="#1a1a2e">Lights ON state</text>
  <rect x="700" y="1434" width="18" height="18" fill="#f8d7da" stroke="#1a1a2e"/>
  <text x="725" y="1448" font-size="13" fill="#1a1a2e">Lights OFF state</text>

  <text x="500" y="1480" text-anchor="middle" font-size="12" fill="#777">Inputs: PIR Motion Sensor, LDR Light Sensor, Manual Switch, RTC Timer  |  Output: Relay-driven Lighting Load</text>
</svg>
